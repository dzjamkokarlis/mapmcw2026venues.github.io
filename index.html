<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map">
  <button id="map-fringe-btn">+ Show More Venues</button>
</div>
<div id="list-panel">
  <div id="list-header">
    <div id="header-top">
      <div id="title-section">
        <h2 id="header-title">Loading&hellip;</h2>
        <span id="header-subtitle"></span>
      </div>
      <div id="logo-slot"><img id="festival-logo" src="" alt="Festival Logo"></div>
    </div>
    <div id="button-container">
      <!-- These buttons are generated automatically from the Festivals tab of the Google Sheet -->
      <div id="festival-buttons"></div>
    </div>
  </div>
  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>
<script src="script.js"></script>
</body>
</html>
